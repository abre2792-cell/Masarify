<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصرّفي</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مصرّفي">
<meta name="theme-color" content="#E9ECE5">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Tajawal:wght@400;500;700&display=swap');

:root{
  --ink:#16202A;
  --ink-2:#3D4C58;
  --paper:#E9ECE5;
  --card:#FFFFFF;
  --line:#CFD5CB;
  --stamp:#C1392B;
  --money:#20694C;
  --muted:#7C8A84;
  --shadow: 0 1px 0 rgba(22,32,42,.06), 0 8px 24px -16px rgba(22,32,42,.5);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Tajawal','Segoe UI',Tahoma,'Noto Sans Arabic',system-ui,sans-serif;
  font-size:16px; line-height:1.55;
  padding-bottom:40px;
}
.wrap{max-width:520px; margin:0 auto; padding:0 14px}
.num{font-variant-numeric:tabular-nums; letter-spacing:.2px}

/* ---------- header ---------- */
header{padding:22px 0 14px}
.brand{display:flex; align-items:baseline; gap:8px}
.brand h1{
  font-family:'Cairo','Segoe UI',Tahoma,sans-serif;
  font-weight:900; font-size:26px; margin:0; letter-spacing:-.5px;
}
.brand span{font-size:12px; color:var(--muted)}

.strip{
  margin-top:14px; background:var(--ink); color:#F3F5F0; border-radius:14px;
  padding:16px 16px 14px; box-shadow:var(--shadow);
}
.strip .row{display:flex; justify-content:space-between; align-items:flex-end; gap:10px}
.strip .lbl{font-size:12px; color:#9FB0A8; margin-bottom:2px}
.strip .big{font-family:'Cairo',sans-serif; font-weight:900; font-size:30px; line-height:1}
.strip .side{text-align:left}
.strip .side .v{font-weight:700; font-size:17px}
.bar{height:7px; background:#26313C; border-radius:99px; margin-top:14px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--money); border-radius:99px; transition:width .5s ease}
.bar i.over{background:var(--stamp)}
.strip .hint{font-size:12px; color:#9FB0A8; margin-top:8px}

/* ---------- tabs ---------- */
nav{
  position:sticky; top:0; z-index:20; background:var(--paper);
  padding:12px 0 10px; margin-top:14px;
}
.tabs{display:flex; background:#DDE2D9; border-radius:12px; padding:4px; gap:2px}
.tabs button{
  flex:1; border:0; background:transparent; padding:9px 2px; border-radius:9px;
  font-family:inherit; font-size:13px; font-weight:700; color:var(--ink-2); cursor:pointer;
}
.tabs button[aria-selected="true"]{background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(22,32,42,.14)}
.tabs button:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

/* ---------- cards ---------- */
.card{background:var(--card); border-radius:14px; padding:16px; box-shadow:var(--shadow); margin-bottom:14px}
.card h2{font-family:'Cairo',sans-serif; font-size:16px; font-weight:700; margin:0 0 12px}
.card h2 small{display:block; font-family:'Tajawal',sans-serif; font-weight:400; font-size:12.5px; color:var(--muted); margin-top:3px}

label{display:block; font-size:12.5px; color:var(--ink-2); font-weight:700; margin:0 0 5px}
input,select,textarea{
  width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:10px;
  font-family:inherit; font-size:15.5px; color:var(--ink); background:#FCFDFB;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink); outline-offset:1px; border-color:transparent}
textarea{resize:vertical; min-height:78px; line-height:1.5}
.field{margin-bottom:11px}
.two{display:grid; grid-template-columns:1fr 1fr; gap:10px}

.btn{
  width:100%; padding:13px; border:0; border-radius:11px; background:var(--ink); color:#fff;
  font-family:'Cairo',sans-serif; font-weight:700; font-size:15px; cursor:pointer;
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line)}
.btn.danger{background:transparent; color:var(--stamp); border:1.5px solid #E4C4C0}
.btn:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

.chips{display:flex; flex-wrap:wrap; gap:7px}
.chips button{
  border:1.5px solid var(--line); background:#FCFDFB; border-radius:99px; padding:7px 12px;
  font-family:inherit; font-size:13.5px; color:var(--ink-2); cursor:pointer;
}
.chips button[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}

/* ---------- table ---------- */
.month-pick{display:flex; align-items:center; gap:8px; margin-bottom:12px}
.month-pick select{flex:1}
table{width:100%; border-collapse:collapse; font-size:14px}
th{
  text-align:right; font-size:11px; font-weight:700; color:var(--muted);
  padding:0 6px 7px; border-bottom:1.5px solid var(--line); letter-spacing:.4px;
}
td{padding:10px 6px; border-bottom:1px solid #EDF0EA; vertical-align:top}
tr:last-child td{border-bottom:0}
td.amt{font-weight:700; white-space:nowrap; text-align:left}
.tag{display:inline-block; font-size:11px; padding:2px 7px; border-radius:99px; color:#fff; white-space:nowrap}
.tagsel{
  font-family:inherit; font-size:11px; font-weight:700; color:#fff; border:0; border-radius:99px;
  padding:3px 8px; -webkit-appearance:none; appearance:none; width:auto; max-width:130px;
}
.tagsel option{color:var(--ink); background:#fff}
.dateedit{
  border:0; background:transparent; font-family:inherit; font-size:12px; color:var(--muted);
  padding:2px 0; width:104px; -webkit-appearance:none;
}
.dateedit:focus{outline:2px solid var(--ink); outline-offset:2px; border-radius:6px}
.dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-left:7px; vertical-align:middle}
tr.catline{cursor:pointer}
tr.catline:active{background:#F5F7F2}
.sub{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-2); padding:4px 0; gap:10px}
.sub span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.src{display:block; font-size:11px; color:var(--muted); margin-top:2px}
.del{border:0; background:none; color:var(--muted); font-size:17px; cursor:pointer; padding:2px 4px; line-height:1}
.empty{text-align:center; color:var(--muted); font-size:14px; padding:26px 10px}
.empty b{display:block; color:var(--ink); font-size:15px; margin-bottom:4px}

/* ---------- category bars ---------- */
.catrow{margin-bottom:11px}
.catrow .t{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:4px}
.catrow .t b{font-weight:700}
.catrow .t span{color:var(--muted); font-size:12.5px}
.track{height:9px; background:#EDF0EA; border-radius:99px; overflow:hidden}
.track i{display:block; height:100%; border-radius:99px}

/* ---------- receipt (signature) ---------- */
.receipt{
  background:#FCFCF8; margin-bottom:14px; padding:24px 18px 26px;
  box-shadow:var(--shadow); position:relative;
  --p:9px;
  -webkit-mask:
    radial-gradient(var(--p) at 50% 0, #0000 98%, #000) top/22px 100% repeat-x,
    radial-gradient(var(--p) at 50% 100%, #0000 98%, #000) bottom/22px 100% repeat-x,
    linear-gradient(#000 0 0) center/100% calc(100% - 20px) no-repeat;
  mask:
    radial-gradient(var(--p) at 50% 0, #0000 98%, #000) top/22px 100% repeat-x,
    radial-gradient(var(--p) at 50% 100%, #0000 98%, #000) bottom/22px 100% repeat-x,
    linear-gradient(#000 0 0) center/100% calc(100% - 20px) no-repeat;
}
.receipt .head{text-align:center; margin-bottom:16px}
.receipt .head h3{font-family:'Cairo',sans-serif; font-size:15px; margin:0; letter-spacing:2px}
.receipt .head p{margin:3px 0 0; font-size:12px; color:var(--muted)}
.line{
  display:flex; align-items:baseline; gap:6px; font-size:14px; padding:5px 0;
}
.line .k{white-space:nowrap}
.line .dots{flex:1; border-bottom:1.5px dotted #C3CBC0; transform:translateY(-4px)}
.line .v{white-space:nowrap; font-weight:700}
.line.total{font-family:'Cairo',sans-serif; font-size:16px; font-weight:900; padding-top:12px; margin-top:8px; border-top:2px solid var(--ink)}
.stamp{
  margin:20px auto 4px; width:fit-content; transform:rotate(-6deg);
  border:2.5px solid var(--stamp); color:var(--stamp); border-radius:8px;
  padding:6px 16px; font-family:'Cairo',sans-serif; font-weight:900; font-size:15px;
  letter-spacing:1px; opacity:.88;
}
.stamp.good{border-color:var(--money); color:var(--money)}
.notes{margin-top:16px; font-size:13.5px; line-height:1.75; color:var(--ink-2)}
.notes div{padding-right:16px; position:relative; margin-bottom:7px}
.notes div::before{content:"—"; position:absolute; right:0; color:var(--muted)}

.split{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:6px}
.split .b{background:#F5F7F2; border-radius:11px; padding:11px 9px; text-align:center}
.split .b .n{font-family:'Cairo',sans-serif; font-weight:900; font-size:17px}
.split .b .l{font-size:11.5px; color:var(--muted); margin-top:2px}

.goalbox{background:#F5F7F2; border-radius:11px; padding:13px; margin-top:12px; font-size:13.5px}
.loading{text-align:center; padding:40px; color:var(--muted)}
.toast{
  position:fixed; bottom:18px; right:50%; transform:translateX(50%) translateY(80px);
  background:var(--ink); color:#fff; padding:11px 18px; border-radius:99px; font-size:14px;
  transition:transform .28s cubic-bezier(.2,.9,.3,1.2); z-index:99; box-shadow:0 8px 24px -8px rgba(0,0,0,.5);
}
.toast.on{transform:translateX(50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brand">
    <h1>مصرّفي</h1><span>مصروفك · تقريرك · توفيرك</span>
  </div>
  <div class="strip">
    <div class="row">
      <div>
        <div class="lbl">صرفت الشهر ده</div>
        <div class="big num" id="hSpent">0</div>
      </div>
      <div class="side">
        <div class="lbl">فاضل معاك</div>
        <div class="v num" id="hLeft">—</div>
      </div>
    </div>
    <div class="bar"><i id="hBar" style="width:0%"></i></div>
    <div class="hint" id="hHint">دخّل دخلك الشهري من تبويب «التوفير» عشان أحسبلك الباقي.</div>
    <div class="hint" id="hSplit" style="margin-top:4px"></div>
    <div class="hint" id="hIn" style="margin-top:4px"></div>
  </div>
</header>

<nav>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-add" aria-selected="true" onclick="go('add')">تسجيل</button>
    <button role="tab" id="t-table" aria-selected="false" onclick="go('table')">الخصم</button>
    <button role="tab" id="t-moves" aria-selected="false" onclick="go('moves')">التحويلات</button>
    <button role="tab" id="t-report" aria-selected="false" onclick="go('report')">التقرير</button>
    <button role="tab" id="t-plan" aria-selected="false" onclick="go('plan')">التوفير</button>
  </div>
</nav>

<main id="view"><div class="loading">بنحمّل بياناتك…</div></main>

</div>
<div class="toast" id="toast"></div>

<script>
const CATS=[
 {id:'food',    l:'مطاعم وكافيهات',  c:'#C1392B'},
 {id:'grocery', l:'جروسري وسوبرماركت',c:'#B5651D'},
 {id:'fuel',    l:'بنزين',           c:'#1E7A4D'},
 {id:'trans',   l:'مواصلات ومواقف',  c:'#5B8C6E'},
 {id:'dewa',    l:'كهربا ومياه',     c:'#3A6EA5'},
 {id:'cooling', l:'تكييف وخدمات المبنى',c:'#4FA3C7'},
 {id:'telecom', l:'نت وموبايل',      c:'#6E56A8'},
 {id:'subs',    l:'اشتراكات',        c:'#8E7CC3'},
 {id:'carloan', l:'قسط العربية',     c:'#7A4B2A'},
 {id:'loan',    l:'قسط البنك',       c:'#8B2E4F'},
 {id:'shop',    l:'ملابس وتسوق',     c:'#B07C2A'},
 {id:'health',  l:'صحة وصيدلية',     c:'#2E8B8B'},
 {id:'personal',l:'عناية ومغسلة',    c:'#A0698C'},
 {id:'car',     l:'صيانة العربية',   c:'#6B7A4B'},
 {id:'fun',     l:'ترفيه وخروج',     c:'#C4568B'},
 {id:'home',    l:'البيت والصيانة',  c:'#4A5A66'},
 {id:'gov',     l:'رسوم حكومية',     c:'#556B2F'},
 {id:'edu',     l:'تعليم',           c:'#3F7D5A'},
 {id:'transfer',l:'تحويلات وصرافة',  c:'#7A6A9B'},
 {id:'cash',    l:'سحب نقدي',        c:'#9B6A3F'},
 {id:'bills',   l:'فواتير أخرى',     c:'#5A6E7A'},
 {id:'other',   l:'حاجات تانية',     c:'#8A9A93'}
];
const SRCS=['Mashreq','EIB','Apple Pay','Careem Pay','كاش'];
const MON=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const KEY='masarify:data';

let S={income:0, annual:0, goalName:'', goalAmount:0, expenses:[], cards:{}, moves:[], dismissed:[], learned:{}};
let openCat='';
let tab='add', selMonth=ym(new Date()), draft={cat:'food', src:'Mashreq', amount:'', sms:'', note:'', date:''};

/* بيحفظ اللي المستخدم كتبه قبل أي إعادة رسم للشاشة */
function sync(){
  const g=id=>{const el=document.getElementById(id); return el?el.value:undefined};
  ['amount','sms','note','date'].forEach(k=>{const v=g(k); if(v!==undefined) draft[k]=v});
}

function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function money(n){return Math.round(n).toLocaleString('en-US')}
function cat(id){return CATS.find(c=>c.id===id)||CATS.find(c=>c.id==='other')}
function esc(s){return String(s||'').replace(/[<>&"]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m]))}
function monthLabel(m){const[y,mm]=m.split('-');return MON[+mm-1]+' '+y}
function ofMonth(m){return S.expenses.filter(e=>e.date.slice(0,7)===m).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id)}
function sum(a){return a.reduce((t,e)=>t+e.amount,0)}
function prevMonth(m){const[y,mm]=m.split('-').map(Number);const d=new Date(y,mm-2,1);return ym(d)}
function daysIn(m){const[y,mm]=m.split('-').map(Number);return new Date(y,mm,0).getDate()}

/* التخزين: localStorage في المتصفح، ولو مش متاح بيرجع لتخزين مؤقت في الذاكرة */
const DB={
  get(k){ try{return localStorage.getItem(k)}catch(e){return MEM[k]||null} },
  set(k,v){ try{localStorage.setItem(k,v); return true}catch(e){MEM[k]=v; return false} },
  del(k){ try{localStorage.removeItem(k)}catch(e){delete MEM[k]} }
};
const MEM={};
let pending=[];   /* سطور التطبيق مش متأكد منها — بتتعرض عليك تقرر */

function acceptPending(i){
  const p=pending[i]; if(!p) return;
  const src=guessSrc(p.msg)||'غير محدد';
  const g=guessCard(p.msg); registerCard(g.last4, g.kind, src);
  S.expenses.push({id:Date.now()+Math.random(), amount:p.amount, cat:guessCat(p.msg)||'other',
                   src, card:g.last4, note:p.msg.slice(0,60), date:p.date});
  pending.splice(i,1); save(); render(); toast('اتسجلت — '+money(p.amount)+' د.إ');
}
function setCat(id, v){
  const e=S.expenses.find(x=>x.id===id); if(!e) return;
  e.cat=v;
  const k=merchantKey(merchantOf(e));
  let n=0;
  if(k && k.length>2){
    S.learned[k]=v;                               /* اتعلمنا */
    S.expenses.forEach(x=>{
      if(x.id!==e.id && x.cat!==v && merchantKey(merchantOf(x))===k){ x.cat=v; n++ }
    });
  }
  save(); render();
  toast(n? ('اتغيرت · و'+n+' عملية تانية لنفس المحل') : 'اتغيرت — وهفتكرها للمحل ده');
}

/* نقل العملية لتاريخ/شهر تاني */
function setDate(id, v){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v||'')) return;
  const e=S.expenses.find(x=>x.id===id); if(!e) return;
  const old=e.date.slice(0,7);
  e.date=v; save(); render();
  toast(old===v.slice(0,7) ? 'التاريخ اتغير' : 'اتنقلت لـ '+monthLabel(v.slice(0,7)));
}
function delMove(id){ S.moves=S.moves.filter(m=>m.id!==id); save(); render(); toast('اتمسحت') }

/* لو عملية اتسجلت مصروف وهي في الحقيقة تحويل بين حساباتك */
function expenseToMove(id){
  const e=S.expenses.find(x=>x.id===id); if(!e) return;
  S.moves.push({id:Date.now()+Math.random(), kind:'internal', amount:e.amount,
                date:e.date, card:e.card||null, note:(e.sig||e.note||'').slice(0,60)});
  S.expenses=S.expenses.filter(x=>x.id!==id);
  save(); render(); toast('اتشالت من المصروفات — بقت تحويل');
}

/* لو حركة اتصنّفت تحويل وهي في الحقيقة مصروف */
function moveToExpense(id){
  const m=S.moves.find(x=>x.id===id); if(!m) return;
  const src=guessSrc(m.note)||'غير محدد';
  const g=guessCard(m.note); registerCard(g.last4, g.kind, src);
  S.expenses.push({id:Date.now()+Math.random(), amount:m.amount, cat:guessCat(m.note)||'other',
                   src, card:g.last4, note:(m.note||'').slice(0,60), sig:(m.note||'').slice(0,200), date:m.date});
  S.moves=S.moves.filter(x=>x.id!==id);
  save(); render(); toast('اتنقلت للمصروفات');
}
function delCard(k){
  if(!confirm('هتمسح البطاقة دي من القايمة. العمليات هتفضل موجودة.')) return;
  delete S.cards[k]; save(); render();
}
function dropPending(i){
  const p=pending[i]; if(p){ S.dismissed.push(p.date+'|'+p.amount); save() }
  pending.splice(i,1); render();
}

function load(){
  const raw=DB.get(KEY);
  if(raw){ try{ S=Object.assign(S,JSON.parse(raw)) }catch(e){} }
  render();
}
function save(){
  if(!DB.set(KEY, JSON.stringify(S)))
    toast('المتصفح مانع التخزين — البيانات مش هتفضل بعد ما تقفل');
}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2400)}
function go(t){tab=t;['add','table','moves','report','plan'].forEach(x=>document.getElementById('t-'+x).setAttribute('aria-selected',x===t));render();window.scrollTo({top:0,behavior:'smooth'})}


/* ---------- استخراج المبلغ من نص الرسالة ---------- */
/* بيستبعد الرقم اللي جاي بعد Avl Bal (ده رصيد)، وبيفضّل الدرهم على العملة الأجنبية */
function extractAmount(txt){
  const t=(txt||'').replace(/,/g,'');
  const cur='(?:AED|Dhs?\\.?|د\\.إ|درهم|USD|EUR|GBP|SAR|EGP)';
  const re=new RegExp(cur+'\\s*(\\d+(?:\\.\\d{1,2})?)|(\\d+(?:\\.\\d{1,2})?)\\s*'+cur,'gi');
  const bal=/(bal|balance|avl|avail|available|remaining|limit|رصيد|المتاح)/i;
  let hit=null, any=null, mm;
  while((mm=re.exec(t))!==null){
    const val=mm[1]||mm[2];
    if(bal.test(t.slice(Math.max(0,mm.index-30), mm.index))) continue;
    if(any===null) any=val;
    if(/AED|Dh|درهم|د\.إ/i.test(mm[0]) && hit===null) hit=val;
  }
  return hit||any;
}

/* ---------- تخمين الفئة ووسيلة الدفع من نص الرسالة ---------- */
const CAT_MAP=[
  /* أقساط — لازم تتفحص الأول عشان متتلخبطش مع الفواتير */
  ['auto loan','carloan'],['auto finance','carloan'],['car loan','carloan'],['car finance','carloan'],
  ['vehicle finance','carloan'],['قسط السيارة','carloan'],['قسط العربية','carloan'],

  ['dib','DIB'],['dubai islamic','DIB'],['rakbank','RAKBANK'],
  ['emirates islamic','EIB'],['emiratesislamic','EIB'],['eib','EIB'],['islamic card','EIB'],

function guessCat(txt){
  const k=merchantKey(merchantFromText(txt));
  if(k && S.learned[k]) return S.learned[k];      /* المحل ده صححته قبل كده */
  const t=(txt||'').toLowerCase();
  const h=CAT_MAP.find(p=> p[0].includes('\\b') ? new RegExp(p[0],'i').test(t) : t.includes(p[0]));
  return h?h[1]:null;
}
function guessSrc(txt){const t=(txt||'').toLowerCase();const h=SRC_MAP.find(p=>t.includes(p[0]));return h?h[1]:null}

/* ---------- التعرف على البطاقة: آخر 4 أرقام + نوعها ---------- */
function guessCard(msg){
  const t=msg||'';
  const masked=t.match(/(\d{6})\*{4,}/);              // 511879******0000
  const tail=t.match(/[Xx*]{3,}\s*(\d{4,})/);          // XXXXXXX592001
  const m=t.match(/(?:ending(?:\s+(?:with|in))?|card|a\/c|acct|account|xx+|\*{2,})\s*:?\s*(\d{4})/i);
  const last4 = masked ? masked[1] : (tail ? tail[1].slice(-4) : (m?m[1]:null));
  let kind=null;
  if(/credit\s*card|بطاقة\s*ائتمان/i.test(t)) kind='credit';
  else if(/debit\s*card|current\s*account|savings|بطاقة\s*خصم/i.test(t)) kind='debit';
  return {last4, kind};
}

/* بيسجّل البطاقة أول مرة تظهر، وبعدها تقدر تسمّيها من تبويب التوفير */
function registerCard(last4, kind, src){
  if(!last4) return null;
  if(!S.cards[last4]){
    S.cards[last4]={name:(src&&src!=='غير محدد'?src:'بطاقة')+' ••'+last4, kind:kind||'credit'};
  }else if(kind && !S.cards[last4].kindSet){
    S.cards[last4].kind=kind;
  }
  return last4;
}
/* اسم المحل من نص الرسالة */
function merchantFromText(t){
  t=t||'';
  const m=t.match(/(?:\bat\b|لدى|لصالح)\s*:?\s*([^.,\n]{2,32})/i);
  if(m) return m[1].trim();
  const f=t.match(/from\s+([A-Za-z][^.,\n]{2,28})/i);
  if(f) return f[1].trim();
  return '';
}
function merchantOf(e){
  return merchantFromText(e.sig||e.note) || ((e.src&&e.src!=='غير محدد')?e.src:(e.note||'').slice(0,28));
}
/* مفتاح موحّد للمحل عشان نتعلّم منه */
function merchantKey(name){
  return (name||'').toLowerCase()
    .replace(/[^a-z\u0600-\u06FF ]/g,' ')
    .replace(/\s+/g,' ').trim().split(' ').slice(0,3).join(' ');
}
function cardOf(e){ return e.card && S.cards[e.card] ? S.cards[e.card] : null }
function isCredit(e){ const c=cardOf(e); return c ? c.kind==='credit' : false }

/* ---------- تصنيف الرسالة ---------- */
/* مهم: تحويل فلوس من بطاقة الخصم لبطاقة الائتمان مش مصروف — ده سداد لفاتورة اتسجلت قبل كده.
   لو حسبناه مصروف هيتعد مرتين: مرة وقت الشراء ومرة وقت السداد. */
const JUNK_RE=/(otp|one[- ]time|do not share|verification|offer|enjoy \d|discount|win |congratulations|promo|t&c|opt out|to enroll|avail the|pay as low as|instal?lment plan|convert .{0,20}instal|points redemption|cashback up to)/i;
/* تحويل بين حساباتك أنت — الفلوس مخرجتش من عندك */
const INTERNAL_RE=/(you transferred|transferred aed[^.]{0,25}from (your )?account|to your own account|own account transfer|internal transfer|between your accounts|from your account to your account|تحويل بين حساباتك)/i;
/* عملية اترفضت = مفيش فلوس اتخصمت */
const DECLINED_RE=/(declined|rejected|failed|unsuccessful|not (been )?(processed|completed)|insufficient funds|reversed|مرفوض|فشل)/i;
/* رسايل كشف الحساب فيها مبالغ بس مش عمليات */
const STATEMENT_RE=/(is due|due on|due for|overdue|please settle|pay through|to pay your bill|already (made the|paid)|ignore this (sms|message)|e-statement|statement is ready|total amount due|minimum due|outstanding is|detail is as follows|balance enquiry|مستحقة الدفع|قيمة الفاتورة|الفاتورة الاخيرة|الفاتورة الأخيرة|كشف حساب)/i;
const PAY_WORD=/(payment|paid|settle|settlement|transfer|transferred|سداد|تحويل)/i;
/* السداد = البطاقة هي الوجهة. لو البطاقة هي المصدر ("from/on your card") يبقى ده شراء */
const TO_CARD_RE=/(to your [^.]{0,30}card|towards your [^.]{0,30}card|\bto card\b|for card payment|card payment|received on your [^.]{0,30}card|payment received|thank you for your payment|سداد بطاقة)/i;
const INCOME_RE=/(credited|received|refund|reversal|cashback|salary|deposit|ايداع|استرداد|مرتب)/i;
const SPEND_RE=/(debited|purchase|purchased|spent|paid|payment|deducted|charged|drawn|was used|has been used|withdraw|\bpos\b|\batm\b|transaction|bill|top[- ]?up|successful|processed)/i;
const AT_MERCHANT=/\bat\s+[A-Za-z]/;

function classify(msg){
  const t=msg||'';
  if(JUNK_RE.test(t)) return 'ignore';           /* عرض أو إعلان */
  if(DECLINED_RE.test(t)) return 'ignore';        /* عملية اترفضت — مفيش خصم */
  if(INTERNAL_RE.test(t) && !/family|support|salary|beneficiary/i.test(t)) return 'internal';
  if(STATEMENT_RE.test(t)) return 'ignore';       /* تذكير بفاتورة، مش عملية */
  if(PAY_WORD.test(t) && TO_CARD_RE.test(t) && !AT_MERCHANT.test(t)) return 'payment';
  if(INCOME_RE.test(t)) return 'income';
  if(SPEND_RE.test(t)) return 'spend';
  /* خطة احتياطية: رسالة بنك فيها مبلغ ورقم بطاقة، ومش دخل ولا كشف حساب → مصروف */
  if(guessCard(t).last4 && extractAmount(t)) return 'spend';
  return null;
}

/* في رسايل السداد بيبقى فيه رقمين بطاقة — بناخد بطاقة الائتمان لأنها هي اللي اتسدد ليها */
function payCard(msg){
  const all=[...(msg||'').matchAll(/(?:ending(?:\s+(?:with|in))?|card|a\/c|acct|account|xx+|\*{2,})\s*:?\s*(\d{4})/gi)].map(m=>m[1]);
  const credit=all.find(x=>S.cards[x] && S.cards[x].kind==='credit');
  return credit || all[all.length-1] || null;
}

function addMove(kind, amount, date, card, note){
  if(S.moves.some(m=>m.kind===kind && Math.abs(m.amount-amount)<0.01 &&
                     Math.abs(new Date(m.date)-new Date(date))<=86400000)) return false;
  S.moves.push({id:Date.now()+Math.random(), kind, amount, date, card, note:(note||'').slice(0,60)});
  return true;
}
function movesOf(m, kind){ return S.moves.filter(x=>x.kind===kind && x.date.slice(0,7)===m) }

/* ---------- استيراد الملف اللي الاختصار بيكتبه ---------- */
/* كل سطر شكله:  2026-08-20 14:33|275.50|نص الرسالة كامل */
function importText(raw){
  let added=0, skipped=0, moved=0;
  /* رسايل زي EI بتيجي على أكتر من سطر، فالسطر اللي مش مبتدي بتاريخ|
     بيبقى تكملة اللي قبله مش رسالة جديدة */
  const recs=[];
  (raw||'').split(/\r?\n/).forEach(l=>{
    l=l.trim(); if(!l) return;
    if(/^\d{4}-\d{2}-\d{2}[^|]*\|/.test(l)) recs.push(l);
    else if(recs.length) recs[recs.length-1]+=' '+l;
  });
  recs.forEach(line=>{
    const i1=line.indexOf('|'); if(i1<0) return;
    const i2=line.indexOf('|', i1+1);
    const date=line.slice(0,i1).trim().slice(0,10);
    let amount, msg;
    if(i2<0){                       // تاريخ|الرسالة  → نطلّع المبلغ إحنا
      msg=line.slice(i1+1).trim();
      amount=parseFloat(extractAmount(msg));
    }else{                          // تاريخ|المبلغ|الرسالة
      amount=parseFloat(line.slice(i1+1,i2).replace(/,/g,''));
      msg=line.slice(i2+1).trim();
    }
    if(!amount||!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
    const kind=classify(msg);
    if(kind==='ignore'){ skipped++; return }      /* متأكدين إنها مش عملية */
    if(!kind){
      skipped++;
      if(S.dismissed.includes(date+'|'+amount)) return;
      if(!pending.some(p=>p.date===date&&Math.abs(p.amount-amount)<0.01))
        pending.push({date, amount, msg});
      return;
    }
    if(kind!=='spend'){                       // سداد بطاقة أو فلوس داخلة أو تحويل داخلي
      if(addMove(kind, amount, date, kind==='payment'?payCard(msg):null, msg)) moved++; else skipped++;
      return;
    }
    const src=guessSrc(msg)||'غير محدد';
    const g=guessCard(msg); registerCard(g.last4, g.kind, src);

    /* du وnoon وأمازون بيبعتوا رسالة، والبنك بيبعت رسالة تانية لنفس العملية.
       نفس المبلغ في نفس اليوم = عملية واحدة. بنفضّل رسالة البنك لأن فيها البطاقة. */
    const twin=S.expenses.find(e=>e.date===date && Math.abs(e.amount-amount)<0.01
                                 && (!!e.card !== !!g.last4));   // واحدة فيها بطاقة والتانية لأ
    if(twin){
      if(g.last4 && !twin.card){        // رسالة البنك أغنى — نحدّث القديمة
        twin.card=g.last4; twin.src=src;
        const c=guessCat(msg); if(c) twin.cat=c;
      }
      skipped++; return;
    }
    const sig=msg.slice(0,200);        // بصمة الرسالة كاملة — مش أول 60 حرف
    if(S.expenses.some(e=>e.date===date && Math.abs(e.amount-amount)<0.01 && (e.sig||e.note)===sig)){
      skipped++; return;                // نفس الرسالة بالظبط اتسجلت قبل كده
    }

    S.expenses.push({id:Date.now()+Math.random(), amount, cat:guessCat(msg)||'other',
                     src, card:g.last4, note:msg.slice(0,60), sig, date});
    added++;
  });
  if(added||moved) save();
  render();
  const parts=[];
  if(added) parts.push(added+' عملية');
  if(moved) parts.push(moved+' سداد/إيداع');
  toast(parts.length? ('اتضاف '+parts.join(' · ')+(skipped?' · '+skipped+' اتجاهلت':'')) : 'مفيش حاجة جديدة');
}

function importFile(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>importText(r.result);
  r.onerror=()=>toast('مقدرتش أقرا الملف');
  r.readAsText(f);
}

  const c = draft.catManual ? draft.cat : (guessCat(note+' '+(draft.sms||'')) || draft.cat);

function header(){
  const list=ofMonth(selMonth);
  const sp=sum(list), inc=S.income;
  const credit=sum(list.filter(isCredit));
  const debit=sp-credit;
  const inMoney=sum(movesOf(selMonth,'income'));
  const paid=sum(movesOf(selMonth,'payment'));
  const internal=sum(movesOf(selMonth,'internal'));
  const elIn=document.getElementById('hIn');
  if(elIn){
    const parts=[];
    if(inMoney>0)  parts.push('<b style="color:#8FD3B0">'+money(inMoney)+'</b> فلوس داخلة');
    if(paid>0)     parts.push('<b>'+money(paid)+'</b> سداد بطاقات');
    if(internal>0) parts.push('<b>'+money(internal)+'</b> تحويل بين حساباتك');
    elIn.innerHTML = parts.join(' · ');
  }
  const el=document.getElementById('hSplit');
  if(el) el.innerHTML = sp>0
    ? '<b style="color:#E8B4AE">'+money(credit)+'</b> على الائتمان (فاتورة الشهر الجاي) · <b>'+money(debit)+'</b> خرجت من حسابك'
    : '';
  document.getElementById('hSpent').textContent=money(sp)+' د.إ';
  const bar=document.getElementById('hBar');
  if(inc>0){
    const left=inc-sp, pct=Math.min(100,sp/inc*100);
    document.getElementById('hLeft').textContent=money(left)+' د.إ';
    bar.style.width=pct+'%'; bar.classList.toggle('over',left<0);
    const dLeft=daysIn(selMonth)-new Date().getDate();
    document.getElementById('hHint').textContent = left<0
      ? 'عديت دخلك بـ '+money(-left)+' د.إ الشهر ده.'
      : (selMonth===ym(new Date()) && dLeft>0
          ? 'يعني '+money(left/dLeft)+' د.إ في اليوم لآخر الشهر.'
          : 'من دخل '+money(inc)+' د.إ.');
  }else{
    document.getElementById('hLeft').textContent='—';
    bar.style.width='0%';
    document.getElementById('hHint').textContent='دخّل دخلك الشهري من تبويب «التوفير» عشان أحسبلك الباقي.';
  }
}

  return [...set].sort().reverse().map(m=>`<option value="${m}" ${m===selMonth?'selected':''}>${monthLabel(m)}</option>`).join('');
}

function movesMonth(m){ return S.moves.filter(x=>x.date.slice(0,7)===m).sort((a,b)=>b.date.localeCompare(a.date)) }
function setMoveDate(id,v){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v||'')) return;
  const m=S.moves.find(x=>x.id===id); if(!m) return;
  m.date=v; save(); render(); toast('التاريخ اتغير');
}

function byCat(list){
  return CATS.map(c=>({...c, v:sum(list.filter(e=>e.cat===c.id))})).filter(c=>c.v>0).sort((a,b)=>b.v-a.v);
}

function viewReport(){
  const list=ofMonth(selMonth), sp=sum(list);
  if(!list.length) return `<div class="card"><div class="empty"><b>لسه مفيش بيانات للشهر ده</b>سجّل كام مصروف والتقرير هيتكوّن لوحده.</div></div>`;
  const cats=byCat(list), top=cats[0];
  const prev=sum(ofMonth(prevMonth(selMonth)));
  const isCur=selMonth===ym(new Date());
  const dTotal=daysIn(selMonth), dPassed=isCur?new Date().getDate():dTotal;
  const perDay=sp/dPassed, proj=perDay*dTotal;
  const saved=S.income-sp, rate=S.income>0?saved/S.income*100:null;

  let verdict='محتاج تركيز', good=false;
  if(rate!==null){
    if(rate>=20){verdict='توفير ممتاز'; good=true}
    else if(rate>=10){verdict='ماشي كويس'; good=true}
    else if(rate>=0){verdict='على الحافة'}
    else{verdict='في عجز'}
  }

  const notes=[];
  notes.push(`أكتر باب واخد منك: <b>${top.l}</b> بـ ${money(top.v)} د.إ (${Math.round(top.v/sp*100)}% من مصروفك).`);
  notes.push(`متوسط صرفك <b>${money(perDay)} د.إ</b> في اليوم${isCur&&dPassed<dTotal?`، ولو مشيت بنفس المعدل هتقفل الشهر على <b>${money(proj)} د.إ</b>.`:'.'}`);
  if(prev>0){
    const diff=sp-prev, pct=Math.abs(Math.round(diff/prev*100));
    notes.push(diff>0? `صرفت أكتر من ${monthLabel(prevMonth(selMonth))} بـ <b>${money(diff)} د.إ</b> (+${pct}%).`
                     : `وفّرت عن ${monthLabel(prevMonth(selMonth))} <b>${money(-diff)} د.إ</b> (−${pct}%).`);
  }
  if(rate!==null){
    notes.push(rate>=0? `فضل من دخلك <b>${money(saved)} د.إ</b>، يعني نسبة توفير ${Math.round(rate)}%.`
                      : `عديت دخلك بـ <b>${money(-saved)} د.إ</b> — لازم تقفل باب من دول الشهر الجاي.`);
  }
  if(top.v/sp>0.4) notes.push(`باب «${top.l}» لوحده واخد أكتر من 40% — لو قصّيته 20% بس هتوفر ${money(top.v*0.2)} د.إ في الشهر.`);

  const wallets={}; list.forEach(e=>wallets[e.src]=(wallets[e.src]||0)+e.amount);
  const topW=Object.entries(wallets).sort((a,b)=>b[1]-a[1])[0];

  return `

    <div class="month-pick">
      <label style="margin:0">تقرير شهر</label>
      <select onchange="selMonth=this.value;render()">${monthOptions()}</select>
    </div>
    <div class="split">
      <div class="b"><div class="n num">${money(sp)}</div><div class="l">إجمالي الصرف</div></div>
      <div class="b"><div class="n num">${money(sum(list.filter(isCredit)))}</div><div class="l">فاتورة الائتمان</div></div>
      <div class="b"><div class="n num">${money(perDay)}</div><div class="l">في اليوم</div></div>
    </div>
    ${Object.keys(S.cards).length?`<div style="margin-top:14px">
      ${Object.entries(S.cards).map(([k,c])=>{
        const v=sum(list.filter(e=>e.card===k));
        return v>0?`<div class="line"><span class="k">${esc(c.name)} <span style="color:var(--muted);font-size:12px">${c.kind==='credit'?'ائتمان':'خصم'}</span></span><span class="dots"></span><span class="v num">${money(v)}</span></div>`:'';
      }).join('')}
    </div>`:''}
  </div>

  <div class="card">
    <h2>جدول الشهر بالتفصيل<small>كل نوع مصروف وإجماليه. اضغط على أي بند تشوف عملياته.</small></h2>
    <table>
      <thead><tr><th>البند</th><th>عدد</th><th style="text-align:left">الإجمالي</th><th style="text-align:left">%</th></tr></thead>
      <tbody>
      ${cats.map(c=>{
        const items=list.filter(e=>e.cat===c.id).sort((a,b)=>b.amount-a.amount);
        return `<tr class="catline" onclick="openCat=(openCat==='${c.id}'?'':'${c.id}');render()">
          <td><span class="dot" style="background:${c.c}"></span>${c.l}</td>
          <td class="num" style="color:var(--muted)">${items.length}</td>
          <td class="amt num">${money(c.v)}</td>
          <td class="num" style="color:var(--muted);font-size:12px;text-align:left">${Math.round(c.v/sp*100)}%</td>

        ${openCat===c.id?`<tr><td colspan="4" style="padding:2px 6px 12px;background:#FAFBF8">
          ${items.map(e=>`<div class="sub"><span>${e.date.slice(8)}/${e.date.slice(5,7)} · ${esc(merchantOf(e))}</span><b class="num">${money(e.amount)}</b></div>`).join('')}
        </td></tr>`:''}`;
      }).join('')}
      </tbody>
    </table>
    <div class="line total" style="margin-top:14px"><span class="k">إجمالي الشهر</span><span class="dots"></span><span class="v num">${money(sp)} د.إ</span></div>
    ${topW?`<div class="goalbox">أكتر وسيلة دفع بتصرف منها: <b>${esc(topW[0])}</b> — ${money(topW[1])} د.إ.</div>`:''}
  </div>

  ${(movesOf(selMonth,'income').length||movesOf(selMonth,'payment').length||movesOf(selMonth,'internal').length)?`
  <div class="card">
    <h2>الحركات — ملخص<small>التفاصيل في تبويب «التحويلات».</small></h2>
    <div class="split">
      <div class="b"><div class="n num" style="color:var(--money)">${money(sum(movesOf(selMonth,'income')))}</div><div class="l">دخل ووارد</div></div>
      <div class="b"><div class="n num">${money(sum(movesOf(selMonth,'payment')))}</div><div class="l">سداد بطاقات</div></div>
      <div class="b"><div class="n num">${money(sum(movesOf(selMonth,'internal')))}</div><div class="l">بين حساباتك</div></div>
    </div>
    ${(()=>{
      const prevCr=sum(ofMonth(prevMonth(selMonth)).filter(isCredit));
      const pd=sum(movesOf(selMonth,'payment'));
      const thisCr=sum(list.filter(isCredit));
      return `<div class="goalbox">
        فاتورة ${monthLabel(prevMonth(selMonth))} كانت <b>${money(prevCr)}</b> د.إ، سددت منها الشهر ده <b>${money(pd)}</b>، فاضل <b>${money(Math.max(0,prevCr-pd))}</b>.
        <br><br>واللي بتصرفه دلوقتي على الائتمان (<b>${money(thisCr)}</b> د.إ) ده فاتورة ${monthLabel(selMonth)} اللي هتدفعها الشهر الجاي.
      </div>`})()}

  <div class="receipt">

    <div class="line total"><span class="k">إجمالي المصروفات</span><span class="dots"></span><span class="v num">${money(sp)} د.إ</span></div>

    <div class="head" style="margin:22px 0 10px"><h3>الحركات</h3></div>
    ${sum(movesOf(selMonth,'income'))>0?`<div class="line"><span class="k">فلوس داخلة</span><span class="dots"></span><span class="v num" style="color:var(--money)">+${money(sum(movesOf(selMonth,'income')))}</span></div>`:''}
    ${sum(movesOf(selMonth,'payment'))>0?`<div class="line"><span class="k">سداد بطاقات</span><span class="dots"></span><span class="v num">${money(sum(movesOf(selMonth,'payment')))}</span></div>`:''}
    ${sum(movesOf(selMonth,'internal'))>0?`<div class="line"><span class="k">تحويل بين حساباتك</span><span class="dots"></span><span class="v num">${money(sum(movesOf(selMonth,'internal')))}</span></div>`:''}
    ${(()=>{const net=sum(movesOf(selMonth,'income'))-sum(list.filter(e=>!isCredit(e)))-sum(movesOf(selMonth,'payment'));
      return sum(movesOf(selMonth,'income'))>0 ? `<div class="line total"><span class="k">صافي حسابك</span><span class="dots"></span><span class="v num" style="color:${net<0?'var(--stamp)':'var(--money)'}">${net<0?'−':''}${money(Math.abs(net))} د.إ</span></div>` : ''})()}
    ${S.income>0?`
      <div class="line" style="margin-top:6px"><span class="k">الدخل</span><span class="dots"></span><span class="v num">${money(S.income)}</span></div>
      <div class="line"><span class="k">الفرق</span><span class="dots"></span><span class="v num" style="color:${saved<0?'var(--stamp)':'var(--money)'}">${saved<0?'−':''}${money(Math.abs(saved))}</span></div>
      <div class="stamp ${good?'good':''}">${verdict}</div>`:''}
    <div class="notes">${notes.map(n=>`<div>${n}</div>`).join('')}</div>
  </div>`;

function viewPlan(){
  const inc=S.income;
  const reserve=(S.annual||0)/12;
  const disp=Math.max(0, inc-reserve);
  const need=disp*0.45, want=disp*0.25, sav=disp*0.30;
  const list=ofMonth(selMonth);
  const needCats=['grocery','fuel','trans','car','dewa','cooling','telecom','health','home','carloan','loan','gov','edu','transfer','bills'];
  const actualNeed=sum(list.filter(e=>needCats.includes(e.cat)));
  const actualWant=sum(list.filter(e=>!needCats.includes(e.cat)));
  const months=(S.goalAmount>0 && sav>0)? Math.ceil(S.goalAmount/sav):0;

  return `

        <input id="goalName" placeholder="مثلاً: لابتوب" value="${esc(S.goalName)}"></div>
      <div class="field"><label for="goalAmount">مبلغه (د.إ)</label>
        <input id="goalAmount" type="number" inputmode="decimal" placeholder="0" value="${S.goalAmount||''}"></div>
    </div>
    <button class="btn" onclick="saveIncome()">احفظ</button>
  </div>

  ${inc>0?`
  ${reserve>0?`<div class="card">
    <h2>احتياطي المصاريف السنوية<small>الفلوس اللي بتيجي مرة في السنة وبتكسر أي خطة.</small></h2>
    <div style="font-family:'Cairo',sans-serif;font-weight:900;font-size:26px">${money(reserve)} د.إ<span style="font-size:14px;font-weight:400;color:var(--muted)"> / شهر</span></div>
    <div class="goalbox">حوّلهم لحساب منفصل ومتحسبهمش من فلوسك. لما رسوم الخدمة تيجي مرة واحدة تلاقيها جاهزة، بدل ما تاكل توفير 3 شهور.</div>
  </div>`:''}

  <div class="card">
    <h2>الخطة على ${money(disp)} د.إ<small>الدخل ناقص احتياطي السنوي.</small></h2>
    <div class="catrow">
      <div class="t"><b>ضروريات — سقف ${money(need)}</b><span class="num">صرفت ${money(actualNeed)}</span></div>
      <div class="track"><i style="width:${Math.min(100,need>0?actualNeed/need*100:0)}%;background:${actualNeed>need?'var(--stamp)':'var(--money)'}"></i></div>
    </div>
    <div class="catrow">
      <div class="t"><b>مصاريف شخصية — سقف ${money(want)}</b><span class="num">صرفت ${money(actualWant)}</span></div>
      <div class="track"><i style="width:${Math.min(100,want>0?actualWant/want*100:0)}%;background:${actualWant>want?'var(--stamp)':'var(--money)'}"></i></div>
    </div>
    <div class="catrow">
      <div class="t"><b>توفير واستثمار — المستهدف ${money(sav)}</b><span class="num">${money(Math.max(0,disp-sum(list)))} فعلي</span></div>
      <div class="track"><i style="width:${Math.min(100,sav>0?Math.max(0,disp-sum(list))/sav*100:0)}%;background:var(--money)"></i></div>
    </div>
    ${(()=>{const actual=sum(movesOf(selMonth,'income'));
      if(!actual) return '';
      const left=actual-sum(list.filter(e=>!isCredit(e)))-sum(movesOf(selMonth,'payment'));
      return `<div class="goalbox" style="margin-bottom:12px">
        نزل في حسابك الشهر ده <b>${money(actual)}</b> د.إ.
        بعد اللي خرج من الحساب وسداد البطاقات، فاضل منهم <b style="color:${left<0?'var(--stamp)':'var(--money)'}">${money(left)}</b> د.إ.

      </div>`})()}
    <div class="goalbox">
      قسمت الخطة <b>45 / 25 / 30</b> مش 50 / 30 / 20، لأنك مالك سكنك ومش دافع إيجار — أكبر بند عند أي حد هنا مش موجود عندك، فنسبة توفير 20% أقل من اللي وضعك يسمح بيه.
      ${S.goalAmount>0?`<br><br>هدفك «${esc(S.goalName||'هدفك')}» بـ ${money(S.goalAmount)} د.إ هتوصله في حوالي <b>${months} شهر</b> بالمعدل ده.`:''}
    </div>
  </div>`:''}

  ${Object.keys(S.cards).length?`
  <div class="card">
    <h2>بطاقاتي<small>التطبيق بيكتشفها لوحده من الرسايل. سمّيها وحدد نوعها مرة واحدة.</small></h2>
    ${Object.entries(S.cards).map(([k,c])=>`
      <div style="display:grid;grid-template-columns:1fr 104px 28px;gap:8px;margin-bottom:9px;align-items:center">
        <input value="${esc(c.name)}" onchange="S.cards['${k}'].name=this.value;save()">
        <select onchange="S.cards['${k}'].kind=this.value;S.cards['${k}'].kindSet=1;save();render()">
          <option value="credit" ${c.kind==='credit'?'selected':''}>ائتمان</option>
          <option value="debit" ${c.kind==='debit'?'selected':''}>خصم</option>
        </select>
        <button class="del" onclick="delCard('${k}')">×</button>
      </div>`).join('')}
    <div class="goalbox">بطاقة <b>الائتمان</b> = فلوس هتدفعها الشهر الجاي. بطاقة <b>الخصم</b> = فلوس خرجت من حسابك دلوقتي. التطبيق بيفصلهم عشان تعرف فاتورتك الجاية كام.</div>
  </div>`:''}

  <div class="card">
    <h2>إعدادات</h2>
    <button class="btn danger" onclick="resetAll()">امسح كل البيانات</button>
  </div>`;
}

function render(){
  document.getElementById('view').innerHTML =
    tab==='add'?viewAdd(): tab==='table'?viewTable(): tab==='moves'?viewMoves():
    tab==='report'?viewReport(): viewPlan();
  header();
}
load();
</script>
</body>
</html>
